          - article [ref=e81]:
            - heading "Нормализация адреса" [level=3] [ref=e82]
            - text: "Разделяет и помещает сущности переданных адресов (город, улица) в соответствующие поля возвращаемого объекта. Параметр id (идентификатор записи) используется для установления соответствия переданных и полученных записей, так как порядок сортировки возвращаемых записей не гарантируется. Метод автоматически ищет и возвращает индекс близлежащего ОПС по указанному адресу. Адрес считается корректным к отправке, если в ответе запроса:"
            - list [ref=e83]:
              - listitem [ref=e84]:
                - link "quality-code" [ref=e85] [cursor=pointer]:
                  - /url: "#/enums-clean-address-quality"
                - text: =GOOD, POSTAL_BOX, ON_DEMAND или UNDEF_05;
              - listitem [ref=e86]:
                - link "validation-code" [ref=e87] [cursor=pointer]:
                  - /url: "#/enums-clean-address-validation"
                - text: =VALIDATED, OVERRIDDEN или CONFIRMED_MANUALLY.
            - text: Введите
            - link "токен авторизации приложения" [ref=e88] [cursor=pointer]:
              - /url: "#/authorization-token"
            - text: и
            - link "ключ авторизации пользователя" [ref=e89] [cursor=pointer]:
              - /url: "#/authorization-key"
            - text: ", тогда значения заголовков будут сгенерированы автоматически."
