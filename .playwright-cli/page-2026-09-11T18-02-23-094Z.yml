            - heading "Создание заказа - Python (3 версия)" [level=3] [ref=e82]
            - generic [ref=e83]: "# -*- coding: utf-8 -*- # примеры работы с api v1.0 для pyton 3 # необходим установленный модуль \"requests\" # документация модуля: https://requests.readthedocs.io # инструкции по установке модуля: https://requests.readthedocs.io/en/master/user/install import requests import base64 import json def to_base64(str): return base64.b64encode(str.encode()).decode(\"utf-8\") #properties access_token = \"TestAccessToken\" login_password = to_base64(\"login:password\") protocol = \"https://\" host = \"otpravka-api.pochta.ru\" request_headers = { \"Content-Type\": \"application/json\", \"Accept\": \"application/json;charset=UTF-8\", \"Authorization\": \"AccessToken \" + access_token, \"X-User-Authorization\": \"Basic \" + login_password } path = \"/1.0/user/backlog\" new_orders = [ { \"address-type-to\": \"DEFAULT\", \"given-name\": \"Иван\", \"house-to\": \"37\", \"index-to\": 117105, \"mail-category\": \"ORDINARY\", \"mail-direct\": 643, \"mail-type\": \"POSTAL_PARCEL\", \"mass\": 1000, \"middle-name\": \"Иванович\", \"order-num\": \"001\", \"place-to\": \"г Москва\", \"postoffice-code\": \"101000\", \"region-to\": \"г Москва\", \"street-to\": \"ш Варшавское\", \"surname\": \"Иванов\", \"tel-address\": 79459562067, \"transport-type\": \"SURFACE\", \"dimension\": { \"height\": 3, \"length\": 9, \"width\": 73 }, \"fragile\": \"true\" }, { # По данному объекту ожидается ошибка при обработке: \"code\" : \"ILLEGAL_MASS_EXCESS\" # т.к. масса больше установленного ограничения \"address-type-to\": \"DEFAULT\", \"given-name\": \"Сергей\", \"house-to\": \"13\", \"index-to\": 630084, \"mail-category\": \"ORDINARY\", \"mail-direct\": 643, \"mail-type\": \"POSTAL_PARCEL\", \"mass\": 200000, \"middle-name\": \"Владимирович\", \"order-num\": \"002\", \"place-to\": \"г Новосибирск\", \"postoffice-code\": \"101000\", \"region-to\": \"обл Новосибирская\", \"room-to\": \"99\", \"street-to\": \"проезд Газовый\", \"surname\": \"Сидоров\", \"tel-address\": 79458712076, \"transport-type\": \"SURFACE\" } ] url = protocol + host + path response = requests.put(url, headers=request_headers, data=json.dumps(new_orders)) print(\"Status code: \", response.status_code) print(\"Response body: \", response.text)"
